<!doctype html>
<html lang="en">
<head>
<title>Lesson · Python Notebook</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/estilos.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// If the page's code can't start (usually: files on the site from different updates,
// or an old copy in the browser's cache), show a clear message instead of "Loading…".
window.addEventListener("error", function (e) {
  var header = document.querySelector("[data-header]");
  if (header && header.innerHTML.trim()) return;      // the page already started
  if (performance.now() > 20000) return;               // only while the page is starting
  var main = document.querySelector("main");
  if (!main || main.dataset.fallo) return;
  main.dataset.fallo = "1";
  var box = document.createElement("div");
  box.className = "aviso aviso-error";
  box.setAttribute("role", "alert");
  box.innerHTML = "<p><strong>This page couldn't start.</strong></p>" +
    "<p>Press <strong>Ctrl + Shift + R</strong> to reload it.</p>" +
    "<p>If it keeps happening, the files on the website don't match. Upload every file from the latest update (including the <code>js</code> folder) and wait two minutes.</p>" +
    "<p class='texto-suave'><small></small></p>";
  box.querySelector("small").textContent = "Technical detail: " + (e.message || "unknown error");
  main.replaceChildren(box);
  main.hidden = false;
});
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
</head>
<body>
<header class="cabecera" data-header></header>
<main class="hoja">
  <p class="texto-suave">Loading…</p>
</main>

<script type="module">
import { CONFIG, requireLogin, loadCourse, flatten, isUnlocked, loadVisibility, closedMessage, fetchText, param, esc, showFatal, highlightPython } from "./js/app.js?v=2026-11-16";

const { profile } = await requireLogin();
const vis = await loadVisibility(profile.grupo);
const main = document.querySelector("main");

async function mostrar() {
  const id = param("id");
  const curso = await loadCourse();
  const { lessons } = flatten(curso);
  const i = lessons.findIndex((l) => l.id === id);
  if (i < 0) return showFatal("We couldn't find this lesson.");
  const leccion = lessons[i];
  const unit = leccion.unit;
  if (!isUnlocked(unit, profile, vis)) return showFatal(closedMessage(unit, vis, "lesson"));

  document.title = `${leccion.titulo} · ${CONFIG.APP_NAME}`;
  const markdown = await fetchText(`content/lecciones/${encodeURIComponent(id)}.md`);

  const enlaceLeccion = (l, texto) => l && isUnlocked(l.unit, profile, vis)
    ? `<a class="boton" href="leccion.html?id=${encodeURIComponent(l.id)}">${texto}: ${esc(l.titulo)}</a>`
    : "<span></span>";

  const ejercicios = (unit.ejercicios || []).map((e) =>
    `<li><a href="ejercicio.html?id=${encodeURIComponent(e.id)}">${esc(e.titulo)}</a></li>`).join("");

  main.innerHTML = `
    <nav class="migas" aria-label="Breadcrumb"><a href="inicio.html">Home</a> / ${esc(unit.nombre)}</nav>
    <article class="leccion">${window.marked.parse(markdown)}</article>
    ${ejercicios ? `<section class="practica"><h2>Practice what you learned</h2><ul class="lista">${ejercicios}</ul></section>` : ""}
    <nav class="leccion-nav" aria-label="Lessons">
      ${enlaceLeccion(lessons[i - 1], "Previous")}
      ${enlaceLeccion(lessons[i + 1], "Next")}
    </nav>`;
  highlightPython(main);
}

mostrar().catch((err) => {
  console.error(err);
  showFatal("Couldn't load the lesson. Check your internet connection and reload the page.");
});
</script>
</body>
</html>
