<!doctype html>
<html lang="en">
<head>
<title>Home · Python Notebook</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/estilos.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// If the page's code can't start (usually: files on the site from different updates,
// or an old copy in the browser's cache), show a clear message instead of "Loading…".
window.addEventListener("error", function (e) {
  var header = document.querySelector("[data-header]");
  if (header && header.innerHTML.trim()) return;      // the page already started
  if (performance.now() > 20000) return;               // only while the page is starting
  var main = document.querySelector("main");
  if (!main || main.dataset.fallo) return;
  main.dataset.fallo = "1";
  var box = document.createElement("div");
  box.className = "aviso aviso-error";
  box.setAttribute("role", "alert");
  box.innerHTML = "<p><strong>This page couldn't start.</strong></p>" +
    "<p>Press <strong>Ctrl + Shift + R</strong> to reload it.</p>" +
    "<p>If it keeps happening, the files on the website don't match. Upload every file from the latest update (including the <code>js</code> folder) and wait two minutes.</p>" +
    "<p class='texto-suave'><small></small></p>";
  box.querySelector("small").textContent = "Technical detail: " + (e.message || "unknown error");
  main.replaceChildren(box);
  main.hidden = false;
});
</script>
</head>
<body>
<header class="cabecera" data-header></header>
<main class="hoja">
  <p class="texto-suave">Loading…</p>
</main>

<script type="module">
import { sb, CONFIG, showMascot, requireLogin, loadCourse, flatten, isUnlocked, unitState, loadVisibility, formatDate, esc, relativeTime, showFatal } from "./js/app.js?v=2026-11-16";

const { user, profile } = await requireLogin();
document.title = `Home · ${CONFIG.APP_NAME}`;
const main = document.querySelector("main");

try {
  const docente = profile.role === "teacher";
  const [curso, envios, vis] = await Promise.all([
    loadCourse(),
    sb.from("submissions").select("exercise_id, passed, updated_at").eq("user_id", user.id),
    docente ? null : loadVisibility(profile.grupo),
  ]);
  // What this user sees: teachers see everything; students follow their class's settings
  const estadoUnidad = (unit) => docente ? "open" : unitState(unit, vis);
  if (envios.error) throw envios.error;

  const estado = new Map(envios.data.map((s) => [s.exercise_id, s]));
  const { exercises } = flatten(curso);
  const abiertos = exercises.filter((e) => isUnlocked(e.unit, profile, vis));
  const disponibles = abiertos.filter((e) => !e.libre && !e.unit.repaso); // weekly exercises with tests
  const resueltos = disponibles.filter((e) => estado.get(e.id)?.passed).length;

  // "Continue where you left off": the last exercise touched (if unfinished),
  // otherwise the first unfinished exercise that is open.
  let sugerido = null;
  let motivo = "";
  const ultimo = [...envios.data].sort((a, b) => b.updated_at.localeCompare(a.updated_at))[0];
  if (ultimo && !ultimo.passed) {
    sugerido = abiertos.find((e) => e.id === ultimo.exercise_id);
    motivo = `You worked on it ${relativeTime(ultimo.updated_at)}.`;
  }
  if (!sugerido) {
    sugerido = disponibles.find((e) => !estado.get(e.id)?.passed);
    motivo = envios.data.length ? "It's your next unfinished exercise." : "Start here.";
  }

  const continuar = sugerido
    ? `<section class="continuar">
         <h2>Pick up where you left off</h2>
         <a class="continuar-enlace" href="ejercicio.html?id=${encodeURIComponent(sugerido.id)}">${esc(sugerido.titulo)}</a>
         <p>${esc(motivo)} ${esc(sugerido.unit.nombre)}.</p>
       </section>`
    : disponibles.length
      ? `<section class="continuar"><h2>You're all caught up</h2><p>You solved every exercise that's open. You can review any lesson while you wait for the next unit.</p></section>`
      : "";

  const pct = disponibles.length ? Math.round((100 * resueltos) / disponibles.length) : 0;
  const progreso = disponibles.length
    ? `<section class="progreso" aria-label="Your progress">
         <p>You've solved <strong>${resueltos} of ${disponibles.length}</strong> exercises.</p>
         <div class="barra-progreso" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
       </section>`
    : "";

  const marcaEstado = (id, libre) => {
    const s = estado.get(id);
    if (libre) return `<span class="estado estado-libre" aria-label="Free workspace">✎</span>`;
    if (s?.passed) return `<span class="estado estado-ok" aria-label="Solved">✓</span>`;
    if (s) return `<span class="estado estado-progreso" aria-label="In progress"></span>`;
    return `<span class="estado" aria-label="Not started"></span>`;
  };

  const avisoCerrada = (unit) => !vis?.get(unit.id) && unit.desbloqueo
    ? `Opens on ${formatDate(unit.desbloqueo)}.` : "Coming soon.";

  const unidades = curso.unidades.filter((u) => !u.repaso && estadoUnidad(u) !== "hidden").map((unit) => {
    const abierta = estadoUnidad(unit) === "open";
    const aviso = abierta ? "" : `<p class="unidad-aviso">${avisoCerrada(unit)}</p>`;

    const lecciones = (unit.lecciones || []).map((l) => abierta
      ? `<li><a href="leccion.html?id=${encodeURIComponent(l.id)}">${esc(l.titulo)}</a></li>`
      : `<li><span>${esc(l.titulo)}</span></li>`).join("");
    const ejercicios = (unit.ejercicios || []).map((e) => abierta
      ? `<li><a href="ejercicio.html?id=${encodeURIComponent(e.id)}">${marcaEstado(e.id, e.libre)} ${esc(e.titulo)}</a></li>`
      : `<li><span><span class="estado"></span> ${esc(e.titulo)}</span></li>`).join("");

    return `<section class="unidad ${abierta ? "" : "unidad-bloqueada"}">
      <h2>${esc(unit.nombre)}</h2>
      ${aviso}
      <div class="unidad-columnas">
        <div><h3>Lessons</h3><ul class="lista">${lecciones || "<li><span>No lessons yet.</span></li>"}</ul></div>
        <div><h3>Exercises</h3><ul class="lista">${ejercicios || "<li><span>No exercises yet.</span></li>"}</ul></div>
      </div>
    </section>`;
  }).join("");

  // Review section: collapsed, unless the student was last working there
  const repaso = curso.unidades.find((u) => u.repaso && estadoUnidad(u) !== "hidden");
  let seccionRepaso = "";
  if (repaso && estadoUnidad(repaso) === "locked") {
    seccionRepaso = `<section class="unidad unidad-repaso unidad-bloqueada">
      <span class="repaso-titulo">${esc(repaso.titulo)}</span>
      <span class="repaso-resumen">${avisoCerrada(repaso)}</span>
    </section>`;
  } else if (repaso) {
    const ejs = (repaso.ejercicios || []).filter((e) => !e.libre);
    const hechos = ejs.filter((e) => estado.get(e.id)?.passed).length;
    const abierto = ultimo && (repaso.ejercicios || []).some((e) => e.id === ultimo.exercise_id);
    const lecciones = (repaso.lecciones || []).map((l) =>
      `<li><a href="leccion.html?id=${encodeURIComponent(l.id)}">${esc(l.titulo)}</a></li>`).join("");
    const ejercicios = (repaso.ejercicios || []).map((e) =>
      `<li><a href="ejercicio.html?id=${encodeURIComponent(e.id)}">${marcaEstado(e.id, e.libre)} ${esc(e.titulo)}</a></li>`).join("");
    seccionRepaso = `<details class="unidad unidad-repaso" ${abierto ? "open" : ""}>
      <summary>
        <span class="repaso-titulo">${esc(repaso.titulo)}</span>
        <span class="repaso-resumen">${esc(repaso.descripcion || "")} You've solved ${hechos} of ${ejs.length}.</span>
      </summary>
      <div class="unidad-columnas">
        <div><h3>Lessons</h3><ul class="lista">${lecciones}</ul></div>
        <div><h3>Exercises</h3><ul class="lista">${ejercicios}</ul></div>
      </div>
    </details>`;
  }

  main.innerHTML = `
    <div class="titulo-mascota">
      <img class="mascota" data-mascota alt="" hidden>
      <h1>Hi, ${esc(profile.username)}</h1>
    </div>
    ${docente ? `<p class="nota-docente">You see every unit. To choose what each class can see, open <a href="visibilidad.html">Visibility</a>.</p>` : ""}
    ${continuar}
    ${progreso}
    ${seccionRepaso}
    ${unidades}`;
  showMascot(main.querySelector("[data-mascota]"));
} catch (err) {
  console.error(err);
  showFatal("Couldn't load the course. Check your internet connection and reload the page.");
}
</script>
</body>
</html>
