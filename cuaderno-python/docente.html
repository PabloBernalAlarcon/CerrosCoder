<!doctype html>
<html lang="en">
<head>
<title>Teacher panel · Python Notebook</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/estilos.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
</head>
<body>
<header class="cabecera" data-header></header>
<main class="hoja hoja-ancha">
  <div class="panel-cabecera">
    <h1>Teacher panel</h1>
    <div class="panel-controles">
      <label>Group <select id="grupo"></select></label>
      <button type="button" class="boton" id="btn-actualizar">Refresh</button>
      <button type="button" class="boton" id="btn-csv">Download CSV</button>
    </div>
  </div>
  <p class="resumen" id="resumen">Loading…</p>
  <div class="tabla-envoltura"><table class="tabla-progreso" id="tabla"></table></div>
  <ul class="leyenda">
    <li><span class="celda celda-ok">✓</span> Solved</li>
    <li><span class="celda celda-progreso">2</span> In progress (number of times they pressed Check)</li>
    <li><span class="celda-vacia"></span> Not started</li>
    <li><span class="inactivo">Red</span> No recent activity</li>
  </ul>

  <dialog class="dialogo" id="dialogo" aria-labelledby="dialogo-titulo">
    <form method="dialog" class="dialogo-cerrar"><button class="boton boton-suave boton-pequeno">Close</button></form>
    <h2 id="dialogo-titulo"></h2>
    <p id="dialogo-detalle" class="texto-suave"></p>
    <pre><code id="dialogo-codigo" class="language-python"></code></pre>
  </dialog>
</main>

<script type="module">
import { sb, CONFIG, requireLogin, loadCourse, flatten, isUnlocked, fetchAll, esc, relativeTime, daysSince, showFatal } from "./js/app.js";

await requireLogin({ teacherOnly: true });
document.title = `Teacher panel · ${CONFIG.APP_NAME}`;

const selectGrupo = document.getElementById("grupo");
const tabla = document.getElementById("tabla");
const resumen = document.getElementById("resumen");
const dialogo = document.getElementById("dialogo");

const curso = await loadCourse();
const { exercises } = flatten(curso);
const disponibles = exercises.filter((e) => isUnlocked(e.unit, null)); // what students can see today

let estudiantes = [];
let envios = new Map();     // "userId|exerciseId" -> row
let ultimaVez = new Map();  // userId -> latest updated_at

async function cargar() {
  resumen.textContent = "Loading…";
  const [perfiles, filas] = await Promise.all([
    fetchAll(() => sb.from("profiles").select("id, username, grupo").eq("role", "student").order("grupo").order("username")),
    fetchAll(() => sb.from("submissions").select("user_id, exercise_id, passed, attempts, updated_at").order("user_id").order("exercise_id")),
  ]);
  estudiantes = perfiles;
  envios = new Map();
  ultimaVez = new Map();
  for (const f of filas) {
    envios.set(`${f.user_id}|${f.exercise_id}`, f);
    if (!ultimaVez.has(f.user_id) || f.updated_at > ultimaVez.get(f.user_id)) ultimaVez.set(f.user_id, f.updated_at);
  }

  const grupos = [...new Set(estudiantes.map((e) => e.grupo).filter(Boolean))].sort();
  const elegido = selectGrupo.value || "__todos";
  selectGrupo.innerHTML = `<option value="__todos">All</option>` +
    grupos.map((g) => `<option value="${esc(g)}">${esc(g)}</option>`).join("");
  selectGrupo.value = grupos.includes(elegido) ? elegido : "__todos";
  pintar();
}

function filtrados() {
  const g = selectGrupo.value;
  return g === "__todos" ? estudiantes : estudiantes.filter((e) => e.grupo === g);
}

const resueltosDe = (uid) => disponibles.filter((e) => envios.get(`${uid}|${e.id}`)?.passed).length;

function pintar() {
  const lista = filtrados();
  if (!lista.length) {
    resumen.textContent = "There are no students in this group yet. Create them with scripts/estudiantes.py.";
    tabla.innerHTML = "";
    return;
  }
  const activosSemana = lista.filter((e) => daysSince(ultimaVez.get(e.id)) < 7).length;
  resumen.textContent = `${lista.length} students. ${activosSemana} worked on the platform in the last 7 days.`;

  const cabeza = exercises.map((e, i) => {
    const abierto = isUnlocked(e.unit, null);
    return `<th class="col-ejercicio ${abierto ? "" : "bloqueado"}" scope="col" title="Unit ${e.unit.numero}: ${esc(e.titulo)}${abierto ? "" : " (not open to students yet)"}">
      <span class="vertical">${i + 1}. ${esc(e.titulo)}</span></th>`;
  }).join("");

  const filas = lista.map((est) => {
    const celdas = exercises.map((e) => {
      const f = envios.get(`${est.id}|${e.id}`);
      if (!f) return `<td><span class="celda-vacia" aria-label="Not started"></span></td>`;
      const etiqueta = `${est.username}, ${e.titulo}: ${f.passed ? "solved" : "in progress"}, checked ${f.attempts} times`;
      return `<td><button type="button" class="celda ${f.passed ? "celda-ok" : "celda-progreso"}"
        data-u="${est.id}" data-e="${esc(e.id)}" aria-label="${esc(etiqueta)}" title="${esc(etiqueta)}">${f.passed ? "✓" : f.attempts}</button></td>`;
    }).join("");
    const ultima = ultimaVez.get(est.id);
    const inactivo = daysSince(ultima) >= CONFIG.DIAS_INACTIVO;
    return `<tr>
      <th class="col-estudiante" scope="row">${esc(est.username)}</th>
      ${celdas}
      <td class="col-dato">${resueltosDe(est.id)} / ${disponibles.length}</td>
      <td class="col-dato ${inactivo ? "inactivo" : ""}">${relativeTime(ultima)}</td>
    </tr>`;
  }).join("");

  const pie = exercises.map((e) => {
    const n = lista.filter((est) => envios.get(`${est.id}|${e.id}`)?.passed).length;
    return `<td>${Math.round((100 * n) / lista.length)}%</td>`;
  }).join("");

  tabla.innerHTML = `
    <thead><tr><th class="col-estudiante" scope="col">Student</th>${cabeza}<th scope="col">Solved</th><th scope="col">Last active</th></tr></thead>
    <tbody>${filas}</tbody>
    <tfoot><tr><td class="col-estudiante">Solved by</td>${pie}<td></td><td></td></tr></tfoot>`;
}

tabla.addEventListener("click", async (event) => {
  const celda = event.target.closest("button.celda");
  if (!celda) return;
  const est = estudiantes.find((e) => e.id === celda.dataset.u);
  const ej = exercises.find((e) => e.id === celda.dataset.e);
  const f = envios.get(`${celda.dataset.u}|${celda.dataset.e}`);
  document.getElementById("dialogo-titulo").textContent = `${est.username}: ${ej.titulo}`;
  document.getElementById("dialogo-detalle").textContent =
    `${f.passed ? "Solved" : "In progress"}. Checked ${f.attempts} ${f.attempts === 1 ? "time" : "times"}. Last change: ${relativeTime(f.updated_at)}.`;
  const codigo = document.getElementById("dialogo-codigo");
  codigo.textContent = "Loading…";
  dialogo.showModal();
  const { data, error } = await sb.from("submissions").select("code")
    .eq("user_id", celda.dataset.u).eq("exercise_id", celda.dataset.e).single();
  codigo.textContent = "";
  if (error) { codigo.textContent = "Couldn't load the code."; return; }
  if (window.CodeMirror?.runMode) window.CodeMirror.runMode(data.code || "", "python", codigo);
  else codigo.textContent = data.code;
});

function descargarCSV() {
  const lista = filtrados();
  const estadoTexto = (uid, eid) => {
    const f = envios.get(`${uid}|${eid}`);
    return !f ? "" : f.passed ? "solved" : "in progress";
  };
  const filas = [["username", "group", ...exercises.map((e) => e.id), "solved", "available", "percent", "last_active"]];
  for (const est of lista) {
    const r = resueltosDe(est.id);
    filas.push([
      est.username, est.grupo,
      ...exercises.map((e) => estadoTexto(est.id, e.id)),
      r, disponibles.length, disponibles.length ? Math.round((100 * r) / disponibles.length) : 0,
      (ultimaVez.get(est.id) || "").slice(0, 10),
    ]);
  }
  const csv = filas.map((f) => f.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }); // BOM so Excel shows accents
  const enlace = document.createElement("a");
  const grupo = selectGrupo.value === "__todos" ? "all" : selectGrupo.value;
  enlace.href = URL.createObjectURL(blob);
  enlace.download = `progress-${grupo}-${new Date().toISOString().slice(0, 10)}.csv`;
  enlace.click();
  URL.revokeObjectURL(enlace.href);
}

selectGrupo.addEventListener("change", pintar);
document.getElementById("btn-actualizar").addEventListener("click", () => cargar().catch(fallo));
document.getElementById("btn-csv").addEventListener("click", descargarCSV);

function fallo(err) {
  console.error(err);
  showFatal("Couldn't load the progress data. Check your internet connection and reload the page.");
}
cargar().catch(fallo);
</script>
</body>
</html>
