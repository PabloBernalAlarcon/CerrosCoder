<!doctype html>
<html lang="en">
<head>
<title>Python Notebook</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/estilos.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<main class="acceso">
  <div class="hoja">
    <p class="acceso-curso" data-subtitulo></p>
    <h1 data-nombre-app>Python Notebook</h1>
    <p class="acceso-saludo" aria-hidden="true">print("Welcome back!")</p>

    <form id="form-entrar" novalidate>
      <label class="campo">
        <span>Username</span>
        <input name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="for example, 8a-07" required>
      </label>
      <label class="campo">
        <span>Password</span>
        <input name="clave" type="password" autocomplete="current-password" required>
      </label>
      <p class="mensaje-error" id="error-entrar" role="alert"></p>
      <button class="boton boton-principal" type="submit">Log in</button>
      <p class="acceso-nota">Forgot your password? Ask your teacher to reset it.</p>
    </form>

    <form id="form-cambiar" hidden novalidate>
      <h2>Create your password</h2>
      <p id="cambiar-texto"></p>
      <label class="campo">
        <span>New password</span>
        <input name="nueva" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <label class="campo">
        <span>Type it again</span>
        <input name="repetir" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <p class="mensaje-error" id="error-cambiar" role="alert"></p>
      <button class="boton boton-principal" type="submit">Save password</button>
      <p class="acceso-nota"><button type="button" class="boton boton-suave boton-pequeno" id="cancelar-cambio">Go back without changing it</button></p>
    </form>
  </div>
</main>

<script type="module">
import { sb, CONFIG, usernameToEmail, currentUser, getProfile, param } from "./js/app.js";

document.title = CONFIG.APP_NAME;
document.querySelector("[data-nombre-app]").textContent = CONFIG.APP_NAME;
document.querySelector("[data-subtitulo]").textContent = CONFIG.COURSE_SUBTITLE;

const formEntrar = document.getElementById("form-entrar");
const formCambiar = document.getElementById("form-cambiar");
const errorEntrar = document.getElementById("error-entrar");
const errorCambiar = document.getElementById("error-cambiar");

async function irADestino() {
  const user = await currentUser();
  try {
    const perfil = await getProfile(user.id);
    location.replace(perfil.role === "teacher" ? "docente.html" : "inicio.html");
  } catch {
    location.replace("inicio.html");
  }
}

function mostrarCambio(obligatorio) {
  formEntrar.hidden = true;
  formCambiar.hidden = false;
  document.getElementById("cambiar-texto").textContent = obligatorio
    ? "This is your first time here. Create a new password that only you know (at least 6 characters)."
    : "Type your new password (at least 6 characters).";
  document.getElementById("cancelar-cambio").hidden = obligatorio;
  formCambiar.nueva.focus();
}

const user = await currentUser();
if (user) {
  if (user.user_metadata?.must_change_password) mostrarCambio(true);
  else if (param("cambiar")) mostrarCambio(false);
  else irADestino();
}

formEntrar.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEntrar.textContent = "";
  const usuario = formEntrar.usuario.value.trim();
  const clave = formEntrar.clave.value;
  if (!usuario || !clave) {
    errorEntrar.textContent = "Type your username and your password.";
    return;
  }
  const boton = formEntrar.querySelector("button[type=submit]");
  boton.disabled = true;
  boton.textContent = "Logging in…";
  const { data, error } = await sb.auth.signInWithPassword({ email: usernameToEmail(usuario), password: clave });
  boton.disabled = false;
  boton.textContent = "Log in";
  if (error) {
    errorEntrar.textContent = /fetch|network/i.test(error.message)
      ? "Can't reach the server. Check your internet connection and try again."
      : "Wrong username or password.";
    return;
  }
  if (data.user.user_metadata?.must_change_password) mostrarCambio(true);
  else irADestino();
});

formCambiar.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorCambiar.textContent = "";
  const nueva = formCambiar.nueva.value;
  if (nueva.length < 6) {
    errorCambiar.textContent = "Your password must have at least 6 characters.";
    return;
  }
  if (nueva !== formCambiar.repetir.value) {
    errorCambiar.textContent = "The two passwords don't match.";
    return;
  }
  const boton = formCambiar.querySelector("button[type=submit]");
  boton.disabled = true;
  const { error } = await sb.auth.updateUser({ password: nueva, data: { must_change_password: false } });
  boton.disabled = false;
  if (error) {
    errorCambiar.textContent = /different|same/i.test(error.message)
      ? "Your new password must be different from the old one."
      : "Couldn't save your password. Please try again.";
    return;
  }
  irADestino();
});

document.getElementById("cancelar-cambio").addEventListener("click", irADestino);
</script>
</body>
</html>
