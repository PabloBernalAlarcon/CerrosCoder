<!doctype html>
<html lang="en">
<head>
<title>Home · Python Notebook</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/estilos.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<header class="cabecera" data-header></header>
<main class="hoja">
  <p class="texto-suave">Loading…</p>
</main>

<script type="module">
import { sb, CONFIG, requireLogin, loadCourse, flatten, isUnlocked, formatDate, esc, relativeTime, showFatal } from "./js/app.js";

const { user, profile } = await requireLogin();
document.title = `Home · ${CONFIG.APP_NAME}`;
const main = document.querySelector("main");

try {
  const [curso, envios] = await Promise.all([
    loadCourse(),
    sb.from("submissions").select("exercise_id, passed, updated_at").eq("user_id", user.id),
  ]);
  if (envios.error) throw envios.error;

  const estado = new Map(envios.data.map((s) => [s.exercise_id, s]));
  const { exercises } = flatten(curso);
  const disponibles = exercises.filter((e) => isUnlocked(e.unit, profile));
  const resueltos = disponibles.filter((e) => estado.get(e.id)?.passed).length;

  // "Continue where you left off": the last exercise touched (if unfinished),
  // otherwise the first unfinished exercise that is open.
  let sugerido = null;
  let motivo = "";
  const ultimo = [...envios.data].sort((a, b) => b.updated_at.localeCompare(a.updated_at))[0];
  if (ultimo && !ultimo.passed) {
    sugerido = disponibles.find((e) => e.id === ultimo.exercise_id);
    motivo = `You started it ${relativeTime(ultimo.updated_at)}.`;
  }
  if (!sugerido) {
    sugerido = disponibles.find((e) => !estado.get(e.id)?.passed);
    motivo = envios.data.length ? "It's your next unfinished exercise." : "Start here.";
  }

  const continuar = sugerido
    ? `<section class="continuar">
         <h2>Pick up where you left off</h2>
         <a class="continuar-enlace" href="ejercicio.html?id=${encodeURIComponent(sugerido.id)}">${esc(sugerido.titulo)}</a>
         <p>${esc(motivo)} Unit ${sugerido.unit.numero}: ${esc(sugerido.unit.titulo)}.</p>
       </section>`
    : disponibles.length
      ? `<section class="continuar"><h2>You're all caught up</h2><p>You solved every exercise that's open. You can review any lesson while you wait for the next unit.</p></section>`
      : "";

  const pct = disponibles.length ? Math.round((100 * resueltos) / disponibles.length) : 0;
  const progreso = disponibles.length
    ? `<section class="progreso" aria-label="Your progress">
         <p>You've solved <strong>${resueltos} of ${disponibles.length}</strong> exercises.</p>
         <div class="barra-progreso" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
       </section>`
    : "";

  const marcaEstado = (id) => {
    const s = estado.get(id);
    if (s?.passed) return `<span class="estado estado-ok" aria-label="Solved">✓</span>`;
    if (s) return `<span class="estado estado-progreso" aria-label="In progress"></span>`;
    return `<span class="estado" aria-label="Not started"></span>`;
  };

  const unidades = curso.unidades.map((unit) => {
    const abierta = isUnlocked(unit, profile);
    const abiertaParaEstudiantes = isUnlocked(unit, null);
    let aviso = "";
    if (!abierta) aviso = `<p class="unidad-aviso">Opens on ${formatDate(unit.desbloqueo)}.</p>`;
    else if (!abiertaParaEstudiantes) aviso = `<p class="unidad-aviso">Students will see it from ${formatDate(unit.desbloqueo)}.</p>`;

    const lecciones = (unit.lecciones || []).map((l) => abierta
      ? `<li><a href="leccion.html?id=${encodeURIComponent(l.id)}">${esc(l.titulo)}</a></li>`
      : `<li><span>${esc(l.titulo)}</span></li>`).join("");
    const ejercicios = (unit.ejercicios || []).map((e) => abierta
      ? `<li><a href="ejercicio.html?id=${encodeURIComponent(e.id)}">${marcaEstado(e.id)} ${esc(e.titulo)}</a></li>`
      : `<li><span><span class="estado"></span> ${esc(e.titulo)}</span></li>`).join("");

    return `<section class="unidad ${abierta ? "" : "unidad-bloqueada"}">
      <h2>Unit ${unit.numero}: ${esc(unit.titulo)}</h2>
      ${aviso}
      <div class="unidad-columnas">
        <div><h3>Lessons</h3><ul class="lista">${lecciones || "<li><span>No lessons yet.</span></li>"}</ul></div>
        <div><h3>Exercises</h3><ul class="lista">${ejercicios || "<li><span>No exercises yet.</span></li>"}</ul></div>
      </div>
    </section>`;
  }).join("");

  main.innerHTML = `
    <h1>Hi, ${esc(profile.username)}</h1>
    ${continuar}
    ${progreso}
    ${unidades}`;
} catch (err) {
  console.error(err);
  showFatal("Couldn't load the course. Check your internet connection and reload the page.");
}
</script>
</body>
</html>
